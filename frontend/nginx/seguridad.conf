# Cabeceras de seguridad del frontend. Se incluyen en cada location estática:
# en nginx, un add_header dentro de una location anula los del nivel superior.
# Las respuestas de /api/ conservan las cabeceras propias de la API (helmet).

# CSP estricta: solo recursos propios. `data:` en img-src es para el logo, que
# la consola muestra como data URL para leer su contador de visitas.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
