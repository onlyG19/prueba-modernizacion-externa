# Integración continua: en cada pull request se verifica el proyecto completo.
#
# En un `pull_request`, GitHub prueba el merge del PR sobre su rama base: se
# verifica exactamente lo que quedaría en master si se acepta. Los tres jobs
# son checks obligatorios de master (protección de rama): sin los tres en
# verde, el PR no se puede mergear.
name: CI

on:
  pull_request:
  # Master también se verifica después de cada merge.
  push:
    branches: [master]

# Un push nuevo al mismo PR cancela la verificación anterior, que ya no sirve.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Solo lectura: el workflow no escribe en el repositorio.
permissions:
  contents: read

# Las mismas versiones que los Dockerfiles. Las acciones van fijadas por SHA:
# una etiqueta se puede mover, un commit no.
env:
  NODE_VERSION: 26.13.0
  PNPM_VERSION: 10.34.9

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # ESLint también revisa el formato (plugin de Prettier). Sin --fix: en CI
      # se reporta, no se corrige.
      - name: Lint y formato
        run: pnpm exec eslint "{src,test}/**/*.ts"
      - name: Tipos
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Tests unitarios
        run: pnpm test
      # Testcontainers levanta Postgres y Redis desechables con el Docker del
      # runner: los mismos e2e que se corren en local.
      - name: Tests e2e (Postgres y Redis reales)
        run: pnpm test:e2e

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Formato
        run: pnpm format:check
      - name: Tests (Vitest, MSW y axe)
        run: pnpm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Las mismas imágenes que docker-compose.yml. Playwright levanta la API
    # (contra una base exclusiva para los e2e) y el frontend.
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prueba_modernizacion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Solo la conexión: el puerto, el JWT y el admin de prueba los fija
    # playwright.config.ts. Son credenciales de un contenedor desechable.
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: prueba_modernizacion
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      # El backend se compila y migra dentro de los e2e (e2e/servidor-api.mjs).
      - name: Dependencias del backend
        run: pnpm install --frozen-lockfile
      - name: Dependencias del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Navegador de Playwright
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests e2e en navegador (Playwright)
        working-directory: frontend
        run: pnpm test:e2e
      # Si algo falla, el trace de Playwright muestra qué vio el navegador.
      - name: Guardar el resultado de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
