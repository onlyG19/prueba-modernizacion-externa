# Frontend estático + proxy de la API. El navegador ve un solo origen (igual
# que con el proxy de Vite en desarrollo), así que no hay CORS de por medio.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno de Docker, consultado en cada petición: si la API se reinicia
    # con otra IP, nginx no queda apuntando a una dirección vieja.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/usuarios → http://api:3000/usuarios
    location /api/ {
        set $api http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: su contenido nunca cambia, caché de un año.
    location /assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        expires 1y;
    }

    # index.html nunca se cachea: cada despliegue llega de inmediato.
    location = /index.html {
        include /etc/nginx/snippets/seguridad.conf;
        expires epoch;
    }

    location / {
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri $uri/ /index.html;
    }
}
