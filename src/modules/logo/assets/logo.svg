<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 40 645 270" width="645" height="270">
  <!--
    Sin fondo propio: el logo se adapta al color de fondo de quien lo muestre.
    El lienzo se ajusta al contorno de la marca (+20 de margen).
  -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3BC4F2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E8C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- u -->
  <path d="M60,80 L60,220 Q60,270 110,270 Q160,270 160,220 L160,80"
        stroke="url(#grad1)" stroke-width="40" fill="none" stroke-linecap="round"/>
  <!-- n -->
  <path d="M200,270 L200,120 Q200,80 240,80 Q280,80 280,120 L280,270"
        stroke="url(#grad1)" stroke-width="40" fill="none" stroke-linecap="round"/>
  <!-- o -->
  <circle cx="380" cy="175" r="90"
          stroke="url(#grad1)" stroke-width="40" fill="none"/>
  <!-- AFP text -->
  <text x="520" y="240" font-family="Arial, sans-serif" font-size="90" fill="#808080" font-weight="300">afp</text>
</svg>
